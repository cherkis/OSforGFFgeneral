fidelity:
  divergences: >
    The OS axioms are formalized in the Glimm-Jaffe probability-measure
    formulation (predicates on ProbabilityMeasure (FieldConfiguration d)) rather
    than the original Schwinger-function formulation of Osterwalder-Schrader. OS3
    is stated in the complex star formulation (OS 1975 axiom E2) with an
    equivalent real reformulation (OS3_ReflectionPositivity_real). OS4 is split
    into a clustering statement and an ergodicity statement, with ergodicity
    derived from a polynomial-clustering bound (alpha = 6; the mass gap m > 0
    gives every polynomial rate). The development is generic in the spacetime
    dimension (2 <= d <= 5, mass m > 0); the OS3 proof route requires d <= 5
    through a proper-time Fubini domination, and the concrete instance provided
    is d = 4 (Bessel kernel).

