status:
  scope: >
    Constructs the massive Gaussian Free Field (GFF) in Euclidean spacetime
    dimension d (generic, 2 <= d <= 5) as a probability measure on the tempered
    distributions S'(R^d) (FieldConfiguration d), built via the Minlos theorem
    from the free covariance (-Delta + m^2)^{-1}, and proves it satisfies all
    five Osterwalder-Schrader axioms (OS0 analyticity, OS1 regularity, OS2
    Euclidean invariance, OS3 reflection positivity, OS4 clustering + ergodicity).
    The per-dimension input is isolated in the typeclass GFFPropagator d m (the
    radial closed form of the covariance and its identification with the
    proper-time integral); the d = 4 Bessel instance is provided, recovering the
    original four-dimensional theorem verbatim. The upper bound d <= 5 enters
    only through the proper-time Fubini domination in the OS3 argument; d = 2, 3
    instances are planned. Nuclear-space structure and the Minlos/Kolmogorov
    machinery are supplied by the external libraries bochner (BochnerMinlos),
    gaussian-field (GaussianField), and kolmogorov_extension4, all axiom-free.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - declaration: "OSforGFF.gaussianFreeField_satisfies_all_OS_axioms_generic"
      file: "OSforGFF/OS/Master.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
